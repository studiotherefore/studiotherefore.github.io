<style>
/* The board's look (template.html), for visitors: slides on a light table, nothing about development. */
:root {
  --ground: #101215; --sheet: #181b20; --sheet-2: #1f232a;
  --ink: #e9ebef; --ink-2: #aeb5c0; --ink-3: #757d8a;
  --rule: #2a2f37; --rule-hi: #3a414c;
  --accent: #93a6ff; --accent-ink: #0f1220;
  --wait: #f0b45a; --wait-wash: #382810;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--body); font-variation-settings: "wdth" 96;
  padding-inline: clamp(16px, 4vw, 48px); padding-block: 28px 64px; }
a { color: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin-inline: auto; display: grid; gap: 36px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 32px;
  border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.mark { display: flex; align-items: center; gap: 14px; }
.mark .glyph { height: 0.54em; width: auto; font-size: clamp(28px, 4vw, 40px); color: var(--accent); flex: none; }
h1 { margin: 0; font: 760 clamp(28px, 4vw, 40px)/1 var(--display); font-variation-settings: "wdth" 72;
  letter-spacing: -0.01em; text-transform: uppercase; }
.meta { font: 12px/1.6 var(--mono); color: var(--ink-3); text-align: right; }
.meta b { color: var(--ink-2); font-weight: 500; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 22px; }
.slide { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 10px;
  display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.shot { aspect-ratio: 16 / 10; width: 100%; border-radius: 2px; overflow: hidden; background: var(--ground);
  position: relative; display: block; border: 0; padding: 0; cursor: zoom-in; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  object-fit: var(--ff, cover); object-position: var(--fx, 50%) var(--fy, 50%);
  transform-origin: var(--fx, 50%) var(--fy, 50%); transform: scale(var(--fz, 1)); }
.shot .none { position: absolute; inset: 0; display: grid; place-items: center; font: 300 52px/1 var(--display); color: var(--rule); }
.shot .n { position: absolute; z-index: 2; right: 8px; bottom: 8px; font: 500 10.5px/1 var(--mono); padding: 4px 7px; border-radius: 3px;
  background: rgba(10, 12, 15, .72); color: var(--ink-2); opacity: 0; transition: opacity .15s; }
.slide:hover .shot .n, .shot:focus-visible .n { opacity: 1; }
.body { padding: 0 6px 4px; display: grid; gap: 10px; min-width: 0; }
h3 { margin: 0; font: 700 21px/1.15 var(--display); font-variation-settings: "wdth" 80; text-wrap: balance; }
.kind { font: 12px/1.4 var(--mono); color: var(--ink-3); margin-top: -6px; }
.about { margin: 0; color: var(--ink-2); font-size: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.links a, .linkbtn { font: 500 12px/1 var(--mono); text-decoration: none; padding: 7px 10px; border-radius: 3px;
  border: 1px solid var(--rule); color: var(--ink-2); background: transparent; cursor: pointer; }
.links a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.links a:hover, .linkbtn:hover { border-color: var(--ink-3); color: var(--ink); }
.links a.primary:hover { color: var(--accent-ink); }
.empty { color: var(--ink-3); font: 12px/1.6 var(--mono); }
footer { border-top: 1px solid var(--rule); padding-top: 14px; font: 12px/1.6 var(--mono); color: var(--ink-3); }

.slide { transition: background-color .45s ease, border-color .45s ease, box-shadow .45s ease; }
.slide:hover { background-color: var(--sheet-2); border-color: var(--rule-hi); transition-duration: .25s;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 18px 34px -14px rgba(0, 0, 0, .85), 0 3px 8px rgba(0, 0, 0, .45); }
@media (prefers-reduced-motion: no-preference) {
  .slide { transition: transform .45s cubic-bezier(.22, .8, .3, 1), background-color .45s ease, border-color .45s ease, box-shadow .45s ease; }
  .slide:hover { transform: translateY(-2px); transition-duration: .26s; }
  .shot img { transition: transform 1.4s cubic-bezier(.22, .7, .3, 1); }
  .slide:hover .shot img { transform: scale(calc(var(--fz, 1) * 1.02)); transition-duration: 1.2s; }
}

/* screenshots, large */
.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(8, 9, 11, .94); display: grid;
  grid-template-rows: 1fr auto; padding: clamp(12px, 3vw, 36px); gap: 12px; }
.viewer[hidden] { display: none; }
.viewer .stage { position: relative; min-height: 0; display: grid; place-items: center; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
.viewer .bar { display: flex; align-items: center; gap: 10px; font: 12px/1 var(--mono); color: var(--ink-3); flex-wrap: wrap; }
.viewer .bar b { font: 700 15px/1 var(--display); font-variation-settings: "wdth" 80; color: var(--ink); margin-right: 4px; }
.viewer .bar .sp { flex: 1; }
.viewer button { font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--rule); color: var(--ink-2); background: var(--sheet); }
.viewer button:hover { border-color: var(--ink-3); color: var(--ink); }
.viewer button:disabled { opacity: .35; cursor: default; }

/* Preview only (served by the board, never published): checks, the public About, leaving shots out. */
.note { border: 1px dashed var(--rule-hi); border-radius: 4px; padding: 10px 12px; font: 12px/1.6 var(--mono); color: var(--ink-3); }
.note b { color: var(--ink-2); font-weight: 500; }
.check { font-size: 13px; color: var(--wait); }
.about-edit { width: 100%; min-height: 110px; resize: vertical; padding: 9px 10px; border-radius: 3px;
  border: 1px solid var(--rule); background: var(--ground); color: var(--ink-2); font: 14px/1.5 var(--body); font-variation-settings: "wdth" 96; }
.about-edit:focus { outline: none; border-color: var(--rule-hi); }
.own { font: 11px/1.3 var(--mono); color: var(--ink-3); }
.head-r { display: grid; gap: 8px; justify-items: end; }
.pub-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; font: 12px/1.3 var(--mono); }
.pub-row[hidden] { display: none; }
.pub-row .site { color: var(--ink-3); text-decoration: none; }
.pub-row .site:hover { color: var(--ink-2); }
.pub-row .busy { color: var(--accent); }
.pub-row .busy.bad { color: var(--wait); }
.publish { font: 500 12px/1 var(--mono); padding: 7px 11px; border-radius: 3px; cursor: pointer;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.publish:disabled { opacity: .45; cursor: default; }
.viewer.out img { opacity: .3; }
.viewer .left-out { color: var(--wait); }
</style>
</head>

// Editing works only in the preview, served by the board (mods/studio/server.py).
const EDIT = DATA.preview && location.protocol === "http:" && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const frameVars = f => !f ? "" : f.fit ? "--ff:contain;--fz:1" : `--fx:${f.x}%;--fy:${f.y}%;--fz:${f.zoom}`;
const shown = p => DATA.preview && !EDIT ? p.images.filter(i => !i.hidden) : p.images;

document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("meta").innerHTML = `<b>${DATA.projects.length}</b> projects`;

function card(p) {
  const imgs = shown(p), cover = imgs[0];
  const live = p.live ? `<a class="primary" href="${esc(p.live)}" target="_blank" rel="noopener">Visit ↗</a>` : "";
  const more = imgs.length > 1 ? `<button type="button" class="linkbtn" data-open="${esc(p.id)}">Screenshots ${imgs.length}</button>` : "";
  const about = EDIT
    ? `<textarea class="about-edit" data-about="${esc(p.id)}" aria-label="Public About for ${esc(p.name)}">${esc(p.about)}</textarea>
       <div class="own">${p.own ? "Your public text. Clear it to use the board's About again." : "The board's About. Edit it here for visitors; saved when you click away."}</div>`
    : p.about.split(/\n\s*\n/).filter(Boolean).map(t => `<p class="about">${esc(t)}</p>`).join("");
  const checks = EDIT && p.checks.length ? `<div class="check">Check the text: it has ${p.checks.join(", ")}.</div>` : "";
  return `<article class="slide" id="${esc(p.id)}">
    <button type="button" class="shot" data-open="${esc(p.id)}" style="${frameVars(p.frame)}" aria-label="Screenshots of ${esc(p.name)}">${cover
      ? `<img src="${esc(cover.src)}" alt="${esc(p.name)}" loading="lazy">${imgs.length > 1 ? `<span class="n">1 / ${imgs.length}</span>` : ""}`
      : `<span class="none">∴</span>`}</button>
    <div class="body">
      <h3>${esc(p.name)}</h3>
      ${p.kind ? `<div class="kind">${esc(p.kind)}</div>` : ""}
      ${about}${checks}
      ${live || more ? `<div class="links">${live}${more}</div>` : ""}
    </div></article>`;
}

function render() {
  document.getElementById("grid").innerHTML = DATA.projects.map(card).join("")
    || `<p class="empty">${EDIT ? "Nothing here yet. On the board, click the globe on a card to put it on your portfolio." : "Projects coming soon."}</p>`;
}
render();

if (EDIT) {
  const note = document.getElementById("preview-note");
  note.hidden = false;
  note.innerHTML = `<b>Preview.</b> Only you see this page. Edit the text for visitors here; open the screenshots to leave any out. The board's globe icon picks which projects appear. Publish puts exactly this (without the editing) on your public site.`;
  document.getElementById("pub-row").hidden = false;
}

// Publish: the clean site goes to studiotherefore.github.io (publish.py checks it first).
document.getElementById("publish").addEventListener("click", async e => {
  const btn = e.currentTarget, busy = document.getElementById("busy");
  if (!confirm(`Publish ${DATA.projects.length} project${DATA.projects.length === 1 ? "" : "s"} to studiotherefore.github.io? Anyone can see it.`)) return;
  btn.disabled = true; busy.className = "busy"; busy.textContent = "Publishing…";
  try {
    const r = await fetch("/api/publish", { method: "POST" });
    const out = await r.json().catch(() => ({}));
    busy.textContent = out.message || (r.ok ? "Published." : "Didn't publish.");
    busy.classList.toggle("bad", !r.ok);
  } catch (err) {
    busy.textContent = "Didn't publish. Is the board server running?"; busy.classList.add("bad");
  }
  btn.disabled = false;
});

async function save(body) {
  const r = await fetch("/api/portfolio", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
}

// ---- Screenshots, large: click a cover; arrows to move, Esc to close ----
const V = { el: document.getElementById("viewer"), p: null, i: 0 };
function show() {
  const imgs = shown(V.p), shot = imgs[V.i];
  document.getElementById("v-img").src = shot.src;
  document.getElementById("v-img").alt = V.p.name;
  document.getElementById("v-name").textContent = V.p.name;
  document.getElementById("v-at").textContent = imgs.length > 1 ? `${V.i + 1} / ${imgs.length}` : "";
  document.getElementById("v-prev").disabled = document.getElementById("v-next").disabled = imgs.length < 2;
  V.el.classList.toggle("out", !!shot.hidden);
  document.getElementById("v-out").hidden = !shot.hidden;
  const hide = document.getElementById("v-hide");
  hide.hidden = !EDIT || shot.cover;
  hide.textContent = shot.hidden ? "Put back" : "Leave out";
}
function openViewer(id) {
  V.p = DATA.projects.find(p => p.id === id);
  if (!V.p || !shown(V.p).length) return;
  V.i = 0; V.el.hidden = false; show();
  document.getElementById("v-close").focus();
}
const step = d => { const n = shown(V.p).length; V.i = (V.i + d + n) % n; show(); };
const closeViewer = () => { V.el.hidden = true; document.getElementById(V.p.id)?.querySelector(".shot")?.focus(); };

document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) return openViewer(open.dataset.open);
  if (e.target.id === "v-prev") step(-1);
  else if (e.target.id === "v-next") step(1);
  else if (e.target.id === "v-close" || e.target.classList.contains("stage")) closeViewer();
  else if (e.target.id === "v-hide") {
    const shot = shown(V.p)[V.i];
    shot.hidden = !shot.hidden; show(); render();
    save({ id: V.p.id, [shot.hidden ? "hide" : "show"]: shot.key }).catch(() => alert("Didn't save. Is the board server running?"));
  }
});
addEventListener("keydown", e => {
  if (V.el.hidden) return;
  if (e.key === "Escape") closeViewer();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});

// The public About: saved when the box loses focus.
document.addEventListener("focusout", e => {
  const box = e.target.closest && e.target.closest("[data-about]");
  if (!box) return;
  const p = DATA.projects.find(x => x.id === box.dataset.about);
  if (box.value.trim() === p.about.trim()) return;
  save({ id: p.id, about: box.value }).then(() => location.reload()).catch(() => alert("Didn't save. Is the board server running?"));
});
